services:
  - type: web
    name: janadhish
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/janadhish.db
    disk:
      name: janadhish-data
      mountPath: /var/data
      sizeGB: 1
