<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | JANADHISH</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/brand-mark.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="announcement-bar">
      <div class="container announcement-inner">
        <span>Need styling guidance? Ask our concierge</span>
        <span>Free returns on eligible pieces</span>
      </div>
    </div>

    <header class="site-header">
      <div class="container nav-shell">
        <a href="/" class="brand-mark" aria-label="JANADHISH home">
          <img class="brand-logo" src="/Images/logo/logo.png" alt="JANADHISH logo" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/shop">Shop All</a>
          <a href="/custom-made">Custom-Made</a>
        </nav>
        <div class="header-actions">
          <button class="icon-button" id="searchToggle" aria-label="Search">⌕</button>
          <a href="/account" class="icon-button" aria-label="My account">◌</a>
          <a href="/cart" class="icon-button cart-button" aria-label="Shopping cart">
            <span>👜</span>
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="inner-page">
      <section class="container product-page">
        <div class="product-gallery" id="productGallery"></div>
        <div class="product-summary" id="productSummary"></div>
      </section>

      <section class="section-spacing alt-bg">
        <div class="container">
          <div class="section-header">
            <p class="eyebrow">Related pieces</p>
            <h2>Complete your look</h2>
          </div>
          <div class="product-grid" id="relatedProducts"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <a href="/" class="brand-mark footer-brand">
            <img class="brand-logo" src="/Images/logo/logo.png" alt="JANADHISH logo" />
          </a>
        </div>
        <div>
          <h4>Shop</h4>
          <ul>
            <li><a href="/shop">Shop All</a></li>
            <li><a href="/custom-made">Custom-Made</a></li>
          </ul>
        </div>
        <div>
          <h4>Company</h4>
          <ul>
            <li><a href="/about">About Us</a></li>
            <li><a href="/contact">Contact Us</a></li>
          </ul>
        </div>
        <div>
          <h4>Policies</h4>
          <ul>
            <li><a href="/privacy-policy">Privacy Policy</a></li>
            <li><a href="/shipping-policy">Shipping & Returns</a></li>
          </ul>
        </div>
      </div>
      <div class="container footer-bottom">
        <span>© 2026 JANADHISH</span>
      </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/products.js"></script>
  </body>
</html>
