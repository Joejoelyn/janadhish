<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | JANADHISH</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/brand-mark.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell">
        <a href="/" class="brand-mark" aria-label="JANADHISH home">
          <img class="brand-logo" src="/Images/logo/logo.png" alt="JANADHISH logo" />
        </a>
      </div>
    </header>

    <main class="inner-page">
      <section class="page-banner simple-banner">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>We'd love to hear from you</h1>
        </div>
      </section>

      <section class="container contact-layout">
        <form id="contactForm" class="card-box contact-form">
          <div class="form-row"><label>Name<input type="text" name="name" required /></label></div>
          <div class="form-row"><label>Email<input type="email" name="email" required /></label></div>
          <div class="form-row"><label>Phone<input type="tel" name="phone" /></label></div>
          <div class="form-row"><label>Subject<input type="text" name="subject" /></label></div>
          <div class="form-row"><label>Message<textarea name="message" rows="5" required></textarea></label></div>
          <button type="submit" class="button button-primary">Send Message</button>
        </form>
        <aside class="card-box contact-info">
          <h3>Contact details</h3>
          <p>Instagram: <a href="https://www.instagram.com/janadhish_clo/" target="_blank" rel="noopener noreferrer">@janadhish_clo</a></p>
          <p>Phone: <a href="tel:+916378257535">6378257535</a></p>
          <p>Address: Mansi Apt, Bedla Road, opposite Hero Honda Showroom, Bedla Road, Udaipur, Rajasthan.</p>
          <p>Hours: Monday to Saturday, 10:00 AM – 6:00 PM</p>
        </aside>
      </section>
    </main>

    <footer class="site-footer"><div class="container footer-bottom"><span>© 2026 JANADHISH</span></div></footer>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
