<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | JANADHISH</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/brand-mark.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell">
        <a href="/" class="brand-mark" aria-label="JANADHISH home">
          <img class="brand-logo" src="/Images/logo/logo.png" alt="JANADHISH logo" />
        </a>
      </div>
    </header>

    <main class="inner-page">
      <section class="container checkout-layout">
        <form id="checkoutForm" class="checkout-form card-box">
          <h2>Shipping Details</h2>
          <div class="form-grid two-columns">
            <div class="form-row"><label>Full Name<input type="text" name="customer_name" required /></label></div>
            <div class="form-row"><label>Email<input type="email" name="email" required /></label></div>
            <div class="form-row"><label>Phone<input type="tel" name="phone" /></label></div>
            <div class="form-row"><label>Country<input type="text" name="country" value="India" /></label></div>
            <div class="form-row full"><label>Shipping Address<input type="text" name="shipping_address" required /></label></div>
            <div class="form-row"><label>City<input type="text" name="city" required /></label></div>
            <div class="form-row"><label>State<input type="text" name="state" required /></label></div>
            <div class="form-row"><label>Postal Code<input type="text" name="postal_code" required /></label></div>
          </div>

          <h3>Shipping Method</h3>
          <div class="option-grid compact" id="shippingOptions">
            <label><input type="radio" name="shipping_method" value="standard" checked /> Standard</label>
            <label><input type="radio" name="shipping_method" value="express" /> Express</label>
          </div>

          <h3>Payment Method</h3>
          <div class="option-grid compact" id="paymentOptions">
            <label><input type="radio" name="payment_method" value="test_mode" checked /> Test mode</label>
            <label><input type="radio" name="payment_method" value="cod" /> Cash on delivery</label>
            <label><input type="radio" name="payment_method" value="upi" /> UPI</label>
          </div>

          <button type="submit" class="button button-primary full-width">Place Order</button>
        </form>

        <aside class="summary-card">
          <h3>Order Summary</h3>
          <div id="checkoutSummary"></div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-bottom"><span>© 2026 JANADHISH</span></div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/checkout.js"></script>
  </body>
</html>
